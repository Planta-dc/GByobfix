name: build

# The 3DS port is built from source here, and the checks that can be run
# without a console are run here too.
#
# The build job is the first time the port has ever been linked. Until it
# passes, nothing about this port has been shown to work on a console, and
# the documentation says so.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: The host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the tests
        run: make -C tools/host

      - name: Run the tests
        run: make -C tools/host check

      - name: Check the port against the SDK
        run: |
          sudo mkdir -p /opt/devkitpro
          curl -fsSL https://apt.devkitpro.org/install-devkitpro-pacman | sudo bash
          sudo dkp-pacman -Sy --noconfirm 3ds-dev
          tools/host/check-libctru.sh "$DEVKITPRO/libctru/include"

  build-3ds:
    name: Build the 3DS port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        run: ./.github/scripts/install-3ds-packaging-tools.sh

      - name: Build
        run: bash docker/ci-build.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: gameyob-3ds
          path: |
            platform/3ds/gameyob.3dsx
            platform/3ds/gameyob.cia
            platform/3ds/gameyob.3ds

  release:
    name: The 3DS port, as a release
    needs: build-3ds
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        run: ./.github/scripts/install-3ds-packaging-tools.sh

      - name: Build
        run: bash docker/ci-build.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            platform/3ds/gameyob.3dsx
            platform/3ds/gameyob.cia
            platform/3ds/gameyob.3ds
